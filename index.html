<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08161F" />
    <title>Bootstack — Bootstrapping Your Brand to the Top.</title>
    <meta
      name="description"
      content="Bootstack is a marketing + technology growth partner combining branding, websites, software and automation into one complete growth system."
    />
    <meta property="og:title" content="Bootstack — Bootstrapping Your Brand to the Top." />
    <meta
      property="og:description"
      content="Branding + Marketing + Technology + Automation. One partner, multiple growth engines — brands, websites, software, AI automation and marketing systems."
    />
    <meta property="og:type" content="website" />
    <!-- Bootstack B mark. The .ico carries 16-256px for tabs and bookmarks;
         the PNGs cover modern browsers and the iOS home screen. `?v=2` forces
         a refresh past the previously cached icon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins is the one typeface: 600 for headlines, 400 for body, and the
         400 italic for the few italic lines (so they are not a faked slant). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
